<div class="app-shell" [class.sidebar-open]="shellUi.sidebarOpen()">
  @if (shellUi.sidebarOpen()) {
    <button
      type="button"
      class="sidebar-backdrop"
      aria-label="Cerrar menú"
      (click)="closeSidebar()"
    ></button>
  }

  <aside class="sidebar" aria-label="Navegación principal">
    <button
      type="button"
      class="sidebar-tab"
      [attr.aria-expanded]="shellUi.sidebarOpen()"
      aria-label="Abrir o cerrar menú"
      (click)="toggleSidebar()"
    >
      <span class="sidebar-tab-icon">{{ shellUi.sidebarOpen() ? '‹' : '›' }}</span>
      <span class="sidebar-tab-text">Menú</span>
    </button>

    <div class="sidebar-brand">UGR Eventos</div>

    <div class="sidebar-user">
      @if (profile?.profilePicture) {
        <img
          class="sidebar-avatar"
          [src]="profile?.profilePicture"
          alt="Foto de perfil"
        />
      } @else {
        <div class="sidebar-avatar sidebar-avatar-fallback" aria-hidden="true">
          {{ avatarInitials }}
        </div>
      }

      <div class="sidebar-username">{{ username }}</div>
      @if (user?.email) {
        <div class="sidebar-email">{{ user?.email }}</div>
      }
    </div>

    @if (user) {
      <nav class="sidebar-nav">
        <a
          class="sidebar-link"
          [routerLink]="['/u', user.userNumber, 'map']"
          routerLinkActive="sidebar-link-active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeSidebar()"
        >
          Mapa
        </a>
        <a
          class="sidebar-link"
          [routerLink]="['/u', user.userNumber, 'map', 'events']"
          routerLinkActive="sidebar-link-active"
          (click)="closeSidebar()"
        >
          Eventos
        </a>
        <a
          class="sidebar-link"
          [routerLink]="['/u', user.userNumber, 'profile']"
          routerLinkActive="sidebar-link-active"
          (click)="closeSidebar()"
        >
          Ver perfil
        </a>
        <a
          class="sidebar-link"
          [routerLink]="['/u', user.userNumber, 'account']"
          routerLinkActive="sidebar-link-active"
          (click)="closeSidebar()"
        >
          Cuenta
        </a>

        @if (canCreateEvents) {
          <a
            class="sidebar-link sidebar-link-accent"
            [routerLink]="['/u', user.userNumber, 'events', 'new']"
            routerLinkActive="sidebar-link-active"
            (click)="closeSidebar()"
          >
            Crear evento
          </a>
        }
      </nav>
    }

    <button type="button" class="sidebar-logout" (click)="logout()">
      Cerrar sesión
    </button>
  </aside>

  <main class="shell-content">
    <router-outlet></router-outlet>
  </main>
</div>
