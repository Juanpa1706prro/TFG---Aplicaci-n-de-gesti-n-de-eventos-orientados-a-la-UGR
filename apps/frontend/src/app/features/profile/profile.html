<app-column-overlay (close)="closeToMap()">
  @if (publicProfile) {
    <app-public-profile-view
      [profile]="publicProfile"
      [friendStatus]="friendStatus()"
      [friendActionLoading]="friendActionLoading()"
      [friendActionError]="friendActionError()"
      [showUnfriendConfirm]="showUnfriendConfirm()"
      (sendFriendRequest)="sendFriendRequest()"
      (acceptFriendRequest)="acceptFriendRequest()"
      (rejectFriendRequest)="rejectFriendRequest()"
      (openUnfriendConfirm)="openUnfriendConfirm()"
      (closeUnfriendConfirm)="closeUnfriendConfirm()"
      (confirmUnfriend)="confirmUnfriend()"
    />
  } @else if (profileView) {
    <app-my-profile-view [profile]="profileView" />
  } @else if (loadError) {
    <div class="loading-state" role="alert">
      <p>No se ha podido cargar este perfil.</p>
    </div>
  } @else {
    <div class="loading-state" role="status">
      <p>Cargando perfil…</p>
    </div>
  }
</app-column-overlay>
