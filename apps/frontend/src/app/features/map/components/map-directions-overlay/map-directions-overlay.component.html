<div
  class="map-directions-overlay"
  role="region"
  aria-label="Indicaciones al evento"
  (click)="$event.stopPropagation()"
>
  <header class="map-directions-top">
    <div class="map-directions-card">
      <div
        class="map-directions-segment"
        role="group"
        aria-label="Modo de desplazamiento"
      >
        <button
          type="button"
          class="map-directions-segment__btn"
          [class.map-directions-segment__btn--active]="travelMode() === 'WALK'"
          [disabled]="loading()"
          (click)="selectMode('WALK')"
        >
          <svg class="map-directions-segment__icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="5" r="2" fill="currentColor" />
            <path
              fill="currentColor"
              d="M12 8.5 9 14v5.5h2.2l1.3-3.2 1.3 3.2H16V14l-3-5.5z"
            />
          </svg>
          <span class="map-directions-segment__label">A pie</span>
        </button>
        <button
          type="button"
          class="map-directions-segment__btn"
          [class.map-directions-segment__btn--active]="travelMode() === 'DRIVE'"
          [disabled]="loading()"
          (click)="selectMode('DRIVE')"
        >
          <svg class="map-directions-segment__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M5 11.5 6.8 7h10.4L19 11.5V17h-2.2v-2H7.2v2H5v-5.5zm2.8-3.2L7.4 11h9.2l.4-2.7H7.8zM7.5 14.2a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6zm9 0a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6z"
            />
          </svg>
          <span class="map-directions-segment__label">Coche</span>
        </button>
      </div>

      <span class="map-directions-card__divider" aria-hidden="true"></span>

      <div class="map-directions-top__info">
        @if (loading()) {
          <span class="map-directions-top__loading">
            <span class="map-directions-top__spinner" aria-hidden="true"></span>
            Calculando ruta…
          </span>
        } @else if (routeDisplay(); as info) {
          <div class="map-directions-top__stats">
            <span class="map-directions-top__stat">{{ info.durationLabel }}</span>
            <span class="map-directions-top__dot" aria-hidden="true">·</span>
            <span class="map-directions-top__stat">{{ info.distanceLabel }}</span>
          </div>
          @if (info.altNote) {
            <span class="map-directions-top__hint">{{ info.altNote }}</span>
          }
        }
        @if (error()) {
          <p class="map-directions-top__error" role="alert">{{ error() }}</p>
        }
        @if (routeDisplay() || loading()) {
          <span class="map-directions-top__attrib">Ruta: Google Maps</span>
        }
      </div>
    </div>
  </header>

  <button
    type="button"
    class="map-directions-close"
    aria-label="Volver al evento"
    (click)="close()"
  >
    <span aria-hidden="true">×</span>
  </button>
</div>
